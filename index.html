    /**
     * Escapes text safely for HTML attribute and text injection.
     */
    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /**
     * Normalizes external URLs safely.
     */
    function normalizeUrl(raw) {
      const val = String(raw ?? '').trim();
      if (!val) return '';
      if (/^(https?:\/\/|mailto:|tel:)/i.test(val)) return val;
      if (/^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}/.test(val)) return 'https://' + val;
      return '';
    }

    /**
     * Shows a subtle dark toast notification (replaces alert/confirm).
     */
    function showToast(message) {
      const stack = document.getElementById('toast-container');
      if (!stack) return;
      const toast = document.createElement('div');
      toast.className = 'pointer-events-auto rounded-xl bg-ink px-4 py-2.5 text-xs font-medium text-white shadow-xl ring-1 ring-black/10 transition-all duration-300';
      toast.textContent = message;
      stack.appendChild(toast);
      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-1');
        setTimeout(() => toast.remove(), 280);
      }, 2600);
    }

    /**
     * Copies email using iframe-compatible textarea + document.execCommand('copy').
     */
    function copyEmailAddress() {
      const email = String(Runtime.state.profile.email || '').trim();
      if (!email) return;

      let success = false;
      try {
        const ta = document.createElement('textarea');
        ta.value = email;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        ta.style.top = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        success = document.execCommand('copy');
        document.body.removeChild(ta);
      } catch (err) {
        success = false;
      }

      if (!success && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(email).catch(() => {});
      }

      Runtime.copiedRecently = true;
      document.querySelectorAll('[data-copy-email-btn]').forEach(btn => {
        btn.textContent = 'Copied ✓';
      });
      showToast('Copied email: ' + email);

      clearTimeout(window.__copyEmailTimeout);
      window.__copyEmailTimeout = setTimeout(() => {
        Runtime.copiedRecently = false;
        document.querySelectorAll('[data-copy-email-btn]').forEach(btn => {
          btn.textContent = 'Copy Email';
        });
      }, 2300);
    }

                <span ${editAttr('profile.metaRole', true)} class="${editCls()}">${escapeHtml(p.metaRole)}</span>
              </div>
            </div>
          </section>

          <!-- ==================== PURE WHITE MAIN CANVAS ==================== -->
          <main class="mx-auto max-w-[1140px] px-5 sm:px-8 lg:px-10">

            <!-- SECTION 1: MY PORTFOLIO (3-COLUMN FILTERABLE GRID) -->
            <section id="portfolio" class="py-14 md:py-16">
              <div class="flex flex-wrap items-center justify-between gap-4">
                <h2 class="text-[24px] sm:text-[26px] font-bold tracking-tighthead text-ink">My portfolio</h2>
                ${
                  Runtime.isEditMode
                    ? `<button type="button" data-editor-ui="true" onclick="openManageModal('cards')" class="rounded-full bg-ink px-4 py-1.5 text-xs font-semibold text-white hover:bg-[#27272A]">+ Add / Edit Cards</button>`
                    : `<span class="text-[13px] text-muted">Select any item to view full details</span>`
                }
              </div>

              <!-- Monochrome Pill Filters -->
              <div class="mt-5 flex flex-wrap items-center gap-2.5" role="tablist" aria-label="Portfolio Categories">
                ${CATEGORIES.map(cat => {
                  const active = Runtime.activeCategory === cat;
                  return `
                    <button
                      type="button"
                      role="tab"
                      aria-selected="${active ? 'true' : 'false'}"
                      onclick="setCategory('${escapeHtml(cat)}')"
                      class="rounded-full border px-4 py-1.5 text-[13px] font-medium transition-all ${
                        active
                          ? 'border-ink bg-ink text-white'
                          : 'border-hairline bg-white text-secondary hover:border-ink hover:text-ink'
                      }"
                    >
                      ${escapeHtml(cat)}
                    </button>
                  `;
                }).join('')}
              </div>

              <!-- 3-Column Card Grid -->
              <div class="mt-8 grid grid-cols-1 gap-7 sm:grid-cols-2 lg:grid-cols-3">
                ${visibleCards.map(item => `
                  <article
                    onclick="openDetailView('${escapeHtml(item.id)}')"
                    tabindex="0"
                    onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openDetailView('${escapeHtml(item.id)}');}"
                    class="group cursor-pointer focus:outline-none"
                    aria-label="Open ${escapeHtml(item.title)} detail view"
                  >
                    <!-- Soft-Gray Rounded Showcase Frame -->
                    <div class="aspect-[16/11] w-full overflow-hidden rounded-2xl border border-heroborder bg-framebg p-4 transition-all duration-300 group-hover:-translate-y-1 group-hover:shadow-[0_14px_30px_rgba(17,17,17,0.07)] group-focus-visible:ring-2 group-focus-visible:ring-ink">
                      ${renderItemMockup(item, 'thumb')}
                    </div>

                    <!-- Caption Row: 24px Circular Emblem + Concise Title -->
                    <div class="mt-3 flex items-center justify-between gap-2.5">
                      <div class="flex min-w-0 items-center gap-2.5">
                        <span
                          class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-[11px] font-bold tracking-tight"
                          style="background-color:${escapeHtml(item.badgeBg || '#111111')};color:${escapeHtml(item.badgeText || '#FFFFFF')}"
                        >
                          ${escapeHtml(item.badgeSymbol || item.title.charAt(0).toUpperCase())}
                        </span>
                        <h3 class="truncate text-[15px] font-medium tracking-[-0.01em] text-ink group-hover:underline underline-offset-4">
                          ${escapeHtml(item.title)}
                        </h3>
                      </div>
                      <span class="shrink-0 text-[12px] text-muted opacity-0 transition-opacity duration-200 group-hover:opacity-100">
                        ${escapeHtml(item.category)}
                      </span>
                    </div>
                  </article>
                `).join('')}
              </div>

              ${
                visibleCards.length === 0
                  ? `<div class="mt-8 rounded-2xl border border-hairline bg-herobg py-12 text-center text-sm text-secondary">No portfolio items in ${escapeHtml(Runtime.activeCategory)} yet.</div>`
                  : ''
              }
            </section>

            <!-- SECTION 2: ABOUT & SNAPSHOT -->
            <section id="about" class="border-t border-hairline py-14 md:py-16">
              <h2 class="text-[24px] sm:text-[26px] font-bold tracking-tighthead text-ink">About &amp; Snapshot</h2>

              <div class="mt-7 grid grid-cols-1 gap-8 lg:grid-cols-12 lg:items-start">
                <!-- Left Column: Concise Editorial Bio -->
                <div class="lg:col-span-7 space-y-4">
                  <p ${editAttr('about.paragraph1', false)} class="text-[15.5px] leading-[1.72] text-secondary${editCls()}">
                    ${escapeHtml(s.about.paragraph1)}
                  </p>
                  <p ${editAttr('about.paragraph2', false)} class="text-[15.5px] leading-[1.72] text-secondary${editCls()}">
                    ${escapeHtml(s.about.paragraph2)}
                  </p>
                </div>

                <!-- Right Column: 2x2 Crisp Metric Grid -->
                <div class="lg:col-span-5 grid grid-cols-2 gap-3.5">
                  ${s.about.metrics.map((m, idx) => `
                    <div class="rounded-2xl border border-heroborder bg-herobg p-5">
                      <div ${editAttr(`about.metrics.${idx}.value`, true)} class="text-[22px] sm:text-[24px] font-bold tracking-tight text-ink${editCls()}">
                        ${escapeHtml(m.value)}
                      </div>
                      <p ${editAttr(`about.metrics.${idx}.label`, false)} class="mt-1.5 text-[12.5px] leading-snug text-secondary${editCls()}">
                        ${escapeHtml(m.label)}
                      </p>
                    </div>
                  `).join('')}
                </div>
              </div>
            </section>

            <!-- SECTION 3: ACADEMIC CURRICULUM & 5-YEAR BPT ROADMAP -->
            <section id="curriculum" class="border-t border-hairline py-14 md:py-16">
              <div>
                <h2 class="text-[24px] sm:text-[26px] font-bold tracking-tighthead text-ink">Academic Curriculum &amp; 5-Year BPT Roadmap</h2>
                <p class="mt-1.5 text-[14.5px] text-secondary">4 Years Academics (2026–2030) + 1 Year Compulsory Rotatory Clinical Internship (2030–2031)</p>
              </div>

              <!-- Monochrome Pill Tabs -->
              <div class="mt-6 flex flex-wrap items-center gap-2.5" role="tablist" aria-label="BPT 5-Year Curriculum Tabs">
                ${[
                  { id: 'year1', label: 'Year 1 Academics (2026–27)' },
                  { id: 'years2to4', label: 'Years 2–4 Academics (2027–30)' },
                  { id: 'internship', label: '1-Year Rotatory Internship (2030–31)' }
                ].map(tab => {
                  const active = Runtime.activeCurriculumTab === tab.id;
                  return `
                    <button
                      type="button"
                      role="tab"
                      aria-selected="${active ? 'true' : 'false'}"
                      onclick="setCurriculumTab('${tab.id}')"
                      class="rounded-full border px-4 py-1.5 text-[13px] font-medium transition-all ${
                        active
                          ? 'border-ink bg-ink text-white'
                          : 'border-hairline bg-white text-secondary hover:border-ink hover:text-ink'
                      }"
                    >
                      ${tab.label}
                    </button>
                  `;
                }).join('')}
              </div>

              ${renderCurriculumContent()}
            </section>

            <!-- SECTION 4: SKILLS & CLINICAL TOOLKIT -->
            <section id="skills" class="border-t border-hairline py-14 md:py-16">
              <div class="flex flex-wrap items-end justify-between gap-4">
                <div>
                  <h2 class="text-[24px] sm:text-[26px] font-bold tracking-tighthead text-ink">Skills &amp; Clinical Toolkit</h2>
                  <p class="mt-1.5 text-[14.5px] text-secondary">Pre-clinical foundations combined with healthcare operations and patient communication.</p>
                </div>
                ${
                  Runtime.isEditMode
                    ? `<button type="button" data-editor-ui="true" onclick="openManageModal('skills')" class="rounded-full border border-hairline bg-white px-4 py-1.5 text-xs font-semibold text-ink hover:border-ink">Edit Skills</button>`
                    : ''
                }
              </div>

              <div class="mt-7 grid grid-cols-1 gap-5 md:grid-cols-3">
                ${s.skillGroups.map(group => `
                  <div class="rounded-2xl border border-heroborder bg-herobg p-6">
                    <h3 class="text-[15px] font-bold tracking-tight text-ink">${escapeHtml(group.title)}</h3>
                    <div class="mt-4 flex flex-wrap gap-2">
                      ${group.skills.map(skill => `
                        <span class="rounded-full border border-hairline bg-white px-3 py-1.5 text-[12.5px] font-medium text-ink">
                          ${escapeHtml(skill)}
                        </span>
                      `).join('')}
                    </div>
                  </div>
                `).join('')}
              </div>
            </section>

            <!-- SECTION 5: EDUCATION & TIMELINE -->
            <section id="education" class="border-t border-hairline py-14 md:py-16">
              <h2 class="text-[24px] sm:text-[26px] font-bold tracking-tighthead text-ink">Education &amp; Timeline</h2>

              <div class="mt-7 divide-y divide-hairline border-t border-b border-hairline">
                ${s.education.map((row, idx) => `
                  <div class="grid grid-cols-1 gap-2 py-5 sm:grid-cols-12 sm:gap-6">
                    <div ${editAttr(`education.${idx}.period`, true)} class="sm:col-span-3 text-[13.5px] font-semibold text-muted${editCls()}">
                      ${escapeHtml(row.period)}
                    </div>
                    <div class="sm:col-span-9">
                      <h3 class="text-[16px] font-semibold tracking-tight text-ink">
                        <span ${editAttr(`education.${idx}.title`, true)} class="${editCls()}">${escapeHtml(row.title)}</span>
                        <span class="font-normal text-muted"> — </span>
                        <span ${editAttr(`education.${idx}.institution`, true)} class="font-medium text-secondary${editCls()}">${escapeHtml(row.institution)}</span>
                      </h3>
                      <p ${editAttr(`education.${idx}.description`, false)} class="mt-1.5 text-[14px] leading-relaxed text-secondary${editCls()}">
                        ${escapeHtml(row.description)}
                      </p>
                    </div>
                  </div>
                `).join('')}
              </div>
            </section>

            <!-- SECTION 6: CONTACT & MINIMAL FOOTER -->
            <section id="contact" class="py-12 md:py-16">
              <div class="rounded-3xl border border-heroborder bg-herobg px-6 py-10 sm:px-10 sm:py-12">
                <div class="flex flex-col justify-between gap-7 lg:flex-row lg:items-center">
                  <div class="max-w-xl">
                    <h2 ${editAttr('contact.headline', true)} class="text-[28px] sm:text-[34px] font-bold tracking-display text-ink${editCls()}">
                      ${escapeHtml(s.contact.headline)}
                    </h2>
                    <p ${editAttr('contact.subtitle', false)} class="mt-2 text-[15px] leading-relaxed text-secondary${editCls()}">
                      ${escapeHtml(s.contact.subtitle)}
                    </p>
                  </div>

                  <div class="flex flex-wrap items-center gap-2.5">
                    <a
                      href="mailto:${escapeHtml(p.email)}"
                      class="inline-flex items-center justify-center rounded-full bg-ink px-6 py-3 text-[13.5px] font-medium text-white hover:bg-[#27272A] transition-colors"
                    >
                      Email Me
                    </a>
                    <button
                      type="button"
                      data-copy-email-btn="true"
                      onclick="copyEmailAddress()"
                      class="inline-flex items-center justify-center rounded-full border border-hairline bg-white px-5 py-3 text-[13.5px] font-medium text-ink hover:border-ink transition-colors"
                    >
                      ${Runtime.copiedRecently ? 'Copied ✓' : 'Copy Email'}
                    </button>
                    ${
                      linkedinUrl
                        ? `<a
                             href="${escapeHtml(linkedinUrl)}"
                             target="_blank"
                             rel="noopener noreferrer"
                             class="inline-flex items-center justify-center rounded-full border border-hairline bg-white px-5 py-3 text-[13.5px] font-medium text-ink hover:border-ink transition-colors"
                           >
                             LinkedIn &#8599;
                           </a>`
                        : ''
                    }
                    <a
                      href="${cvUrl || '#contact'}"
                      ${cvUrl ? 'target="_blank" rel="noopener noreferrer"' : 'onclick="handleCvClick(event)"'}
                      class="inline-flex items-center justify-center rounded-full border border-hairline bg-white px-5 py-3 text-[13.5px] font-medium text-ink hover:border-ink transition-colors"
                    >
                      Download CV
                    </a>
                  </div>
                </div>
              </div>

              <!-- Minimal Single-Row Footer -->
              <footer class="mt-10 flex flex-col items-start justify-between gap-3 border-t border-hairline pt-6 text-[13px] text-muted sm:flex-row sm:items-center">
                <p>&copy; 2026 ${escapeHtml(p.name)}</p>
                <p>Jaipur, Rajasthan &middot; BPT (2026–2031)</p>
              </footer>
            </section>

          </main>
        </div>
      `;
    }

    /**
     * VIEW 2 — DEDICATED FULL DETAIL VIEW (Faithfully mirrors the right-hand Roamento screen).
     */
    function renderDetailView(item) {
      const items = Runtime.state.portfolioItems;
      const idx = items.findIndex(x => x.id === item.id);
      const prevItem = idx > 0 ? items[idx - 1] : items[items.length - 1];
      const nextItem = idx < items.length - 1 ? items[idx + 1] : items[0];
      const verifyUrl = normalizeUrl(item.verifyUrl);

      const learnings = Array.isArray(item.learnings) && item.learnings.length
        ? item.learnings
        : [item.subtitle];
      const competencies = Array.isArray(item.competencies) ? item.competencies : [];

      return `
        <div class="view-enter min-h-screen bg-white">
          ${renderTopNav(true)}

          <main class="mx-auto max-w-4xl px-5 pt-10 pb-20 sm:px-8">

            <!-- Header Block: 56px Circular Emblem -> Bold Title -> 1-Line Subtitle -> 3-Col Metadata -->
            <section class="pb-10">
              <div
                class="flex h-[56px] w-[56px] items-center justify-center rounded-full text-[22px] font-bold tracking-tight shadow-sm"
                style="background-color:${escapeHtml(item.badgeBg || '#111111')};color:${escapeHtml(item.badgeText || '#FFFFFF')}"
              >
                ${escapeHtml(item.badgeSymbol || item.title.charAt(0).toUpperCase())}
              </div>

              <h1 class="mt-5 text-[34px] sm:text-[40px] font-bold leading-[1.1] tracking-display text-ink">
                ${escapeHtml(item.title)}
              </h1>

              <p class="mt-2.5 max-w-2xl text-[16px] sm:text-[18px] leading-relaxed text-secondary">
                ${escapeHtml(item.subtitle)}
              </p>

              <!-- 3-Column Metadata Grid -->
              <div class="mt-8 grid max-w-2xl grid-cols-1 gap-5 sm:grid-cols-3 sm:gap-8">
                <div>
                  <div class="text-[11.5px] font-medium uppercase tracking-wider text-muted">Type</div>
                  <div class="mt-1 text-[14px] font-medium text-ink">${escapeHtml(item.type || item.category)}</div>
                </div>
                <div>
                  <div class="text-[11.5px] font-medium uppercase tracking-wider text-muted">Institution / Issuer</div>
                  <div class="mt-1 text-[14px] font-medium text-ink">${escapeHtml(item.issuer)}</div>
                </div>
                <div>
                  <div class="text-[11.5px] font-medium uppercase tracking-wider text-muted">Category &amp; Date</div>
                  <div class="mt-1 text-[14px] font-medium text-ink">${escapeHtml(item.categoryDate || item.category)}</div>
                </div>
              </div>
            </section>

            <!-- Stacked Showcase Frames -->
            <div class="space-y-8">

              <!-- Showcase Frame 1: Enlarged Visual Mockup OR Uploaded Image -->
              <section class="rounded-2xl border border-heroborder bg-detailframe p-5 sm:p-9 md:p-11">
                ${renderItemMockup(item, 'large')}

                ${
                  verifyUrl
                    ? `<div class="mx-auto mt-6 flex max-w-[740px] justify-end">
                         <a
                           href="${escapeHtml(verifyUrl)}"
                           target="_blank"
                           rel="noopener noreferrer"
                           class="inline-flex items-center gap-1.5 rounded-full bg-ink px-5 py-2 text-[12.5px] font-medium text-white hover:bg-[#27272A] transition-colors"
                         >
                           <span>Verify / Open Link</span>
                           <span aria-hidden="true">&#8599;</span>
                         </a>
                       </div>`
                    : ''
                }
              </section>

              <!-- Showcase Frame 2: Structured CPD / Project Reflection Card -->
              <section class="rounded-2xl border border-heroborder bg-detailframe p-5 sm:p-9 md:p-11">
                <div class="mx-auto max-w-[740px] rounded-xl border border-hairline bg-white p-6 sm:p-9 shadow-[0_6px_24px_rgba(17,17,17,0.03)]">

                  <!-- Block 1: Overview & Context -->
                  <div>
                    <h2 class="text-[11.5px] font-semibold uppercase tracking-[0.12em] text-muted">Overview &amp; Context</h2>
                    <p class="mt-3 text-[15px] leading-[1.72] text-secondary">
                      ${escapeHtml(item.overview || item.subtitle)}
                    </p>
                  </div>

                  <!-- Block 2: Key Learnings & Outcomes -->
                  <div class="mt-8 border-t border-hairline pt-7">
                    <h2 class="text-[11.5px] font-semibold uppercase tracking-[0.12em] text-muted">Key Learnings &amp; Outcomes</h2>
                    <ul class="mt-3.5 space-y-3">
                      ${learnings.map(point => `
                        <li class="flex items-start gap-3 text-[14.5px] leading-relaxed text-ink">
                          <span class="mt-2 h-1.5 w-1.5 shrink-0 rounded-full bg-ink"></span>
                          <span>${escapeHtml(point)}</span>
                        </li>
                      `).join('')}
                    </ul>
                  </div>

                  <!-- Block 3: Clinical Relevance to Physiotherapy -->
                  <div class="mt-8 border-t border-hairline pt-7">
                    <h2 class="text-[11.5px] font-semibold uppercase tracking-[0.12em] text-muted">Clinical Relevance to Physiotherapy</h2>
                    <p class="mt-3 text-[15px] leading-[1.72] text-secondary">
                      ${escapeHtml(item.relevance || 'Builds dependable clinical habits and knowledge for the 4+1 Bachelor of Physiotherapy degree.')}
                    </p>
                  </div>

                  <!-- Competency Pills -->
                  ${
                    competencies.length
                      ? `<div class="mt-8 border-t border-hairline pt-7">
                           <h2 class="text-[11.5px] font-semibold uppercase tracking-[0.12em] text-muted">Core Competencies</h2>
                           <div class="mt-3.5 flex flex-wrap gap-2">
                             ${competencies.map(tag => `
                               <span class="rounded-full border border-hairline bg-herobg px-3.5 py-1.5 text-[12.5px] font-medium text-ink">
                                 ${escapeHtml(tag)}
                               </span>
                             `).join('')}
                           </div>
                         </div>`
                      : ''
                  }

                </div>
              </section>

            </div>

            <!-- Bottom Pagination Bar -->
            <nav class="mt-12 flex flex-col items-center justify-between gap-4 border-t border-hairline pt-8 sm:flex-row" aria-label="Portfolio Detail Pagination">
              <button
                type="button"
                onclick="openDetailView('${escapeHtml(prevItem.id)}')"
                class="inline-flex items-center gap-2 text-sm font-medium text-secondary hover:text-ink transition-colors"
              >
                <span aria-hidden="true">&larr;</span>
                <span>Previous: <strong class="font-semibold text-ink">${escapeHtml(prevItem.title)}</strong></span>
              </button>

              <button
                type="button"
                onclick="openDetailView('${escapeHtml(nextItem.id)}')"
                class="inline-flex items-center gap-2 text-sm font-medium text-secondary hover:text-ink transition-colors"
              >
                <span>Next: <strong class="font-semibold text-ink">${escapeHtml(nextItem.title)}</strong></span>
                <span aria-hidden="true">&rarr;</span>
              </button>
            </nav>

          </main>
        </div>
      `;
    }

    /**
     * Master Render Function.
     */
    function renderApp() {
      const root = document.getElementById('app-root');
      if (!root) return;

      const p = Runtime.state.profile;
      const activeItem = Runtime.selectedItemId
        ? Runtime.state.portfolioItems.find(it => it.id === Runtime.selectedItemId)
        : null;

      if (activeItem) {
        document.title = `${activeItem.title} — ${p.name}`;
        root.innerHTML = renderDetailView(activeItem);
      } else {
        Runtime.selectedItemId = null;
        document.title = `${p.wordmark || 'tatsam'} — ${p.name} | BPT Portfolio (2026–2031)`;
        root.innerHTML = renderOverviewView();
      }
    }

    /* ==================== NAVIGATION & INTERACTION HANDLERS ==================== */

    function setCategory(cat) {
      Runtime.activeCategory = cat;
      renderApp();
    }

    function setCurriculumTab(tabId) {
      Runtime.activeCurriculumTab = tabId;
      renderApp();
    }

    function openDetailView(itemId) {
      Runtime.selectedItemId = itemId;
      Runtime.mobileMenuOpen = false;
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closeDetailView() {
      Runtime.selectedItemId = null;
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function returnToOverviewTop() {
      Runtime.selectedItemId = null;
      Runtime.mobileMenuOpen = false;
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleMobileMenu() {
      Runtime.mobileMenuOpen = !Runtime.mobileMenuOpen;
      renderApp();
    }

    function closeMobileMenu() {
      if (!Runtime.mobileMenuOpen) return;
      Runtime.mobileMenuOpen = false;
      renderApp();
    }

    function handleCvClick(event) {
      if (Runtime.isEditMode && typeof openManageModal === 'function') {
        event.preventDefault();
        openManageModal('profile');
        return;
      }
      if (!normalizeUrl(Runtime.state.profile.cvUrl)) {
        event.preventDefault();
        if (typeof openManageModal === 'function') {
          showToast('Tip: Open "Manage" → "Profile & Links" to paste your Resume PDF link.');
        } else {
          showToast('Email directly to request the latest Resume PDF.');
          window.print();
        }
      }
    }

    // Escape key closes open modals or returns from Detail View to Overview View
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      const avatarModal = document.getElementById('avatar-modal');
      const manageModal = document.getElementById('manage-modal');
      const modalOpen =
        (avatarModal && !avatarModal.classList.contains('hidden')) ||
        (manageModal && !manageModal.classList.contains('hidden'));

      if (modalOpen && typeof closeAllModals === 'function') {
        closeAllModals();
        return;
      }
      if (Runtime.selectedItemId) {
        closeDetailView();
      }
    });

    // Boot application
    renderApp();
  </script>

  <!-- ==================== ZERO-CODING LIVE EDITOR & CLEAN EXPORT ENGINE (STRIPPED ON EXPORT) ==================== -->
  

</body></html>
